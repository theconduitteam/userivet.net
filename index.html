<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6c4cf1"><meta name="description" content="RIVET — social, without the noise.">
<title>RIVET</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%236c4cf1'/%3E%3Cpath d='M16 14h32v8H25v7h20v8H25v7h23v8H16z' fill='white'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{--bg:#fafafa;--panel:#fff;--ink:#19181f;--muted:#797783;--line:#e9e7ee;--accent:#6c4cf1;--soft:#f1edff;--radius:18px;--shadow:0 12px 35px #24144c0b;--field:#fff;--top:rgba(255,255,255,.92)}
body.dark{--bg:#111116;--panel:#1b1a22;--ink:#f4f2fa;--muted:#aaa6b6;--line:#302e3a;--soft:#2b2540;--field:#22212b;--top:rgba(24,23,31,.92);--shadow:0 12px 35px #0004}body{transition:background .2s,color .2s}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #bdb0ff;outline-offset:2px}.top{height:68px;position:sticky;top:0;z-index:10;background:var(--top);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.topin{max-width:1100px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900;letter-spacing:-1px}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--accent);color:white;font-weight:900}.nav{display:flex;align-items:center;gap:5px}.nav button,.nav a,.bottomnav button{display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1;white-space:nowrap}.nav svg,.bottomnav svg,.icon svg{display:block;flex:0 0 auto;vertical-align:middle}.nav .label{line-height:1}.nav button,.nav a{border:0;background:transparent;border-radius:11px;padding:10px 12px;color:#555}.nav button:hover,.nav a:hover,.nav .active{background:var(--soft);color:var(--accent)}.shell{max-width:1100px;margin:auto;padding:24px}.layout{display:grid;grid-template-columns:minmax(0,650px) 290px;gap:28px;justify-content:center}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.pad{padding:22px}.storyrow{display:flex;gap:15px;overflow:auto;padding:16px;margin-bottom:18px}.story{text-align:center;min-width:58px;font-size:12px;color:#555}.ring{width:56px;height:56px;padding:3px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(135deg,#ffc14e,#f04f91,#7659ff)}.avatar{display:grid;place-items:center;width:42px;height:42px;flex-shrink:0;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:850}.ring .avatar{width:100%;height:100%;border:2px solid white}.post{margin-bottom:20px;overflow:hidden}.posthead{display:flex;align-items:center;gap:10px;padding:14px 16px}.meta{flex:1;min-width:0}.meta strong{display:block}.muted{color:var(--muted)}.tiny{font-size:12px}.postart{width:100%;aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(135deg,#dcd6ff,#f9dce9 52%,#ffedc9);font-size:58px;font-weight:900;letter-spacing:-3px;color:#6b55bf;overflow:hidden}.postart img{width:100%;height:100%;object-fit:cover}.actions{display:flex;align-items:center;gap:16px;padding:12px 16px 0}.icon{border:0;background:none;padding:3px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center}.icon svg,.nav svg,.bottomnav svg{width:20px;height:20px;stroke-width:1.8}.bottomnav button{display:flex;align-items:center;justify-content:center;min-width:42px;min-height:40px;line-height:1}.icon.liked{color:#e34577}.postbody{padding:7px 16px 16px}.caption{margin:5px 0 8px}.commentrow{display:flex;gap:8px;border-top:1px solid var(--line);padding:12px 16px}.commentrow input{min-width:0;flex:1;border:0;outline:none}.commentrow button{border:0;background:none;color:var(--accent);font-weight:800}.side{padding:18px;margin-bottom:18px}.userrow{display:flex;align-items:center;gap:10px;margin:13px 0}.userrow .meta{flex:1}.btn{display:inline-flex;justify-content:center;align-items:center;gap:7px;border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:white;font-weight:750}.btn:hover{filter:brightness(.95)}.btn.soft{background:var(--soft);color:var(--accent)}.btn.outline{background:var(--field);color:var(--ink);border:1px solid var(--line)}.btn.full{width:100%}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.search{width:100%;padding:12px 13px;border:1px solid #dfdce8;border-radius:12px;background:var(--field);color:var(--ink);outline:none}.field textarea{min-height:125px;resize:vertical}.field input:focus,.field textarea:focus,.search:focus{border-color:var(--accent)}.notice{background:var(--soft);color:#5743bf;padding:12px 14px;border-radius:12px;font-size:13px;margin:12px 0 18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.sectionhead h1{margin:0;font-size:30px;letter-spacing:-1px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(135deg,#ddd6ff,#ffe0ec);font-size:28px;color:#6b55bf;font-weight:800}.profilehead{display:flex;align-items:center;gap:25px;padding:22px 0 30px}.bigavatar{width:94px;height:94px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:30px;font-weight:900}.stats{display:flex;gap:24px;margin:15px 0}.stats strong{display:block}.markdown{border:1px dashed #d9d2ff;border-radius:12px;padding:12px;background:var(--field);min-height:45px;overflow-wrap:anywhere}.footer{text-align:center;color:#9a98a2;font-size:12px;padding:28px 0}.hidden{display:none!important}.tag{font-size:11px;background:#f2f1f5;color:#686571;border-radius:7px;padding:3px 7px}.bottomnav{display:none}
@media(max-width:800px){.shell{padding:15px 12px 88px}.layout{display:block;max-width:650px;margin:auto}.sidepanel{display:none}.top{height:60px}.topin{padding:0 13px}.brand{font-size:20px}.nav .label{display:none}.nav a,.nav button{padding:9px}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);z-index:20}.bottomnav button{border:0;background:transparent;font-size:16px;padding:5px 10px;color:var(--ink)}.bottomnav button.active{color:var(--accent)}.profilehead{gap:15px}.bigavatar{width:72px;height:72px}.stats{gap:14px}.post{border-radius:14px}.sectionhead h1{font-size:27px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="hidden" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:50;background:#19181f;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow)"></div>
<script>
/* Configure with your Supabase project URL and public anon key. Never use service_role in browser code. */
const SUPABASE_URL="https://YOUR_PROJECT_REF.supabase.co";
const SUPABASE_ANON_KEY="YOUR_SUPABASE_ANON_KEY";
const sharedAuthStorage={getItem:async(key)=>{const prefix=encodeURIComponent(key)+'=';const parts=document.cookie.split('; ').filter(x=>x.startsWith(prefix));if(!parts.length)return null;return decodeURIComponent(parts[0].slice(prefix.length))},setItem:async(key,value)=>{document.cookie=encodeURIComponent(key)+'='+encodeURIComponent(value)+'; Domain=.userivet.net; Path=/; Max-Age=31536000; Secure; SameSite=Lax'},removeItem:async(key)=>{document.cookie=encodeURIComponent(key)+'=; Domain=.userivet.net; Path=/; Max-Age=0; Secure; SameSite=Lax'}};
const sb=(window.supabase&&!SUPABASE_URL.includes("YOUR_PROJECT_REF")&&!SUPABASE_ANON_KEY.includes("YOUR_"))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{storage:sharedAuthStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const AUTH_URL='https://auth.userivet.net/', DESKTOP_URL='https://userivet.net/', MOBILE_URL='https://m.userivet.net/';
function isMobileDevice(){return window.matchMedia('(max-width: 800px)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)}
function correctPlatformUrl(){return isMobileDevice()?MOBILE_URL:DESKTOP_URL}
function redirectToPlatform(){const target=correctPlatformUrl();if(location.origin+location.pathname!==target && location.href.split('#')[0]!==target){location.replace(target+location.hash)}}
const app=document.querySelector("#app");
let route="home",searchTerm="",draftImage=null;
const demoPosts=[
{id:"demo1",name:"Maya Chen",handle:"maya",avatar:"M",caption:"A little color for a quiet Tuesday. **Make room for good things.**",symbol:"M",likes:1284,time:"2h"},
{id:"demo2",name:"Jules Rivera",handle:"jules",avatar:"J",caption:"Built something small, shipped it anyway. #indie",symbol:"J",likes:326,time:"4h"},
{id:"demo3",name:"Alex Morgan",handle:"alexm",avatar:"A",caption:"Collecting tiny moments worth remembering.",symbol:"✦",likes:892,time:"1d"}];
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function md(t=""){let x=esc(t);x=x.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>").replace(/\*(.*?)\*/g,"<em>$1</em>").replace(/~~(.*?)~~/g,"<del>$1</del>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/\n/g,"<br>");return x}
function toast(t){const el=document.querySelector("#toast");el.textContent=t;el.classList.remove("hidden");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add("hidden"),2800)}
function applyTheme(){const t=localStorage.getItem('rivet-theme')||'light';document.body.classList.toggle('dark',t==='dark');const c=localStorage.getItem('rivet-accent')||'#6c4cf1';document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--soft',t==='dark'?c+'35':c+'18');const bg=localStorage.getItem('rivet-bg')||(t==='dark'?'#111116':'#fafafa'),panel=localStorage.getItem('rivet-panel')||(t==='dark'?'#1b1a22':'#ffffff'),ink=localStorage.getItem('rivet-ink')||(t==='dark'?'#f4f2fa':'#19181f');document.documentElement.style.setProperty('--bg',bg);document.documentElement.style.setProperty('--panel',panel);document.documentElement.style.setProperty('--ink',ink);document.documentElement.style.setProperty('--field',panel);document.documentElement.style.setProperty('--line',t==='dark'?'#302e3a':'#e9e7ee');document.documentElement.style.setProperty('--top',panel+'ee');document.documentElement.style.setProperty('--radius',(localStorage.getItem('rivet-radius')||'18')+'px')}function toggleTheme(){localStorage.setItem('rivet-theme',document.body.classList.contains('dark')?'light':'dark');applyTheme()}function refreshIcons(){if(window.lucide&&typeof lucide.createIcons==='function')lucide.createIcons()}applyTheme();
function navItem(r,label,icon){return `<button class="${route===r?'active':''}" onclick="go('${r}')" aria-label="${label}">${icon}<span class="label"> ${label}</span></button>`}
function shell(content){app.innerHTML=`<header class="top"><div class="topin"><a class="brand" href="#" onclick="go('home');return false"><span class="logo">R</span>RIVET</a><nav class="nav">${navItem('home','Home','<i data-lucide="house"></i>')}${navItem('explore','Explore','<i data-lucide="search"></i>')}${navItem('create','Create','<i data-lucide="plus-square"></i>')}${navItem('activity','Activity','<i data-lucide="bell"></i>')}${navItem('profile','Profile','<i data-lucide="user-round"></i>')}<button onclick="go('settings')"><i data-lucide="settings"></i><span class="label"> Settings</span></button></nav></div></header><main class="shell">${content}<footer class="footer">RIVET · Social, without the noise. No ads. No tracking pixels.</footer></main><nav class="bottomnav">${navItem('home','Home','<i data-lucide="house"></i>')}${navItem('explore','Explore','<i data-lucide="search"></i>')}${navItem('create','Create','<i data-lucide="plus-square"></i>')}${navItem('activity','Activity','<i data-lucide="bell"></i>')}${navItem('profile','Profile','<i data-lucide="user-round"></i>')}<button onclick="toggleTheme()" aria-label="Toggle light or dark theme"><i data-lucide="sun-moon"></i></button><button onclick="go('settings')" aria-label="Settings"><i data-lucide="settings"></i><span class="label"> Settings</span></button></nav>`;refreshIcons()}
function postCard(p){return `<article class="card post"><div class="posthead"><div class="avatar">${esc(p.avatar||p.name?.[0]||'R')}</div><div class="meta"><strong>${esc(p.name||'RIVET member')}</strong><span class="muted tiny">@${esc(p.handle||'member')} · ${esc(p.time||'now')}</span></div><button class="icon" onclick="toast('Post options')" aria-label="More options"><i data-lucide="ellipsis"></i></button></div><div class="postart">${p.image_url?`<img src="${esc(p.image_url)}" alt="Post image">`:esc(p.symbol||'R')}</div><div class="actions"><button class="icon" onclick="likePost(this,'${esc(p.id)}')" aria-label="Like"><i data-lucide="heart"></i></button><button class="icon" onclick="document.querySelector('#comment-${esc(p.id)}')?.focus()" aria-label="Comment"><i data-lucide="message-circle"></i></button><button class="icon" onclick="navigator.clipboard?.writeText(location.origin+'/#post='+encodeURIComponent(p.id));toast('Post link copied')" aria-label="Share"><i data-lucide="send"></i></button><span style="flex:1"></span><button class="icon" onclick="this.classList.toggle('liked');toast('Saved posts updated')" aria-label="Save post"><i data-lucide="bookmark"></i></button></div><div class="postbody"><strong class="likecount">${Number(p.likes||0).toLocaleString()} likes</strong><p class="caption"><strong>${esc(p.name||'Member')}</strong> ${md(p.caption||'')}</p><button class="muted tiny" style="border:0;background:none;padding:0" onclick="loadComments('${esc(p.id)}')">View comments</button><div id="comments-${esc(p.id)}"></div></div><div class="commentrow"><input id="comment-${esc(p.id)}" placeholder="Add a comment…" aria-label="Add a comment"><button onclick="commentPost('${esc(p.id)}')">Post</button></div></article>`}
async function likePost(btn,id){btn.classList.toggle('liked');btn.textContent=btn.classList.contains('liked')?'♥':'♡';const n=btn.closest('.post').querySelector('.likecount');let count=parseInt(n.textContent.replace(/\D/g,''))||0;n.textContent=(count+(btn.classList.contains('liked')?1:-1)).toLocaleString()+' likes';if(sb){const u=await getUser();if(!u){toast('Sign in to save your likes');return}const action=btn.classList.contains('liked')?'insert':'delete';let q=sb.from('likes')[action]({user_id:u.id,post_id:id});if(action==='delete')q=q.eq('user_id',u.id).eq('post_id',id);const {error}=await q;if(error)toast(error.message)}else toast('Demo like — connect Supabase to save it')}
async function commentPost(id){const input=document.querySelector('#comment-'+CSS.escape(id));const body=input?.value.trim();if(!body)return;if(!sb){toast('Connect Supabase to publish comments');return}const u=await getUser();if(!u){go('signin');return}const {error}=await sb.from('comments').insert({user_id:u.id,post_id:id,body});if(error)toast(error.message);else{input.value='';toast('Comment posted');loadComments(id)}}
async function loadComments(id){if(!sb){toast('Comments load after Supabase is connected');return}const {data,error}=await sb.from('comments').select('body,created_at,profiles(username)').eq('post_id',id).order('created_at',{ascending:true}).limit(50);if(error){toast(error.message);return}const box=document.querySelector('#comments-'+CSS.escape(id));if(box)box.innerHTML=(data||[]).map(c=>`<p class="tiny"><strong>@${esc(c.profiles?.username||'member')}</strong> ${md(c.body)}</p>`).join('')||'<p class="tiny muted">No comments yet.</p>'}
async function getUser(){if(!sb)return null;const {data:{user}}=await sb.auth.getUser();return user}
async function signOut(){if(sb)await sb.auth.signOut();location.replace(AUTH_URL)}
function peopleCard(){return `<aside class="sidepanel"><div class="card side"><div class="userrow"><div class="avatar">R</div><div class="meta"><strong>Your RIVET</strong><span class="muted tiny">Your corner of the internet</span></div></div><button class="btn full" onclick="go('profile')">View profile</button></div><div class="card side"><div class="sectionhead"><strong>People to follow</strong><span class="muted tiny">For you</span></div>${[['A','Alex Morgan','alexm'],['K','Kai Patel','kaip'],['S','Sam Lee','samlee']].map(x=>`<div class="userrow"><div class="avatar">${x[0]}</div><div class="meta"><strong>${x[1]}</strong><span class="muted tiny">@${x[2]}</span></div><button class="btn soft" onclick="follow('${x[2]}',this)">Follow</button></div>`).join('')}</div></aside>`}
function home(){shell(`<div class="layout"><section><div class="card storyrow">${[['Y','you'],['M','maya'],['J','jules'],['A','alex'],['K','kai'],['S','sam']].map(x=>`<div class="story"><div class="ring"><div class="avatar">${x[0]}</div></div>${x[1]}</div>`).join('')}</div><div class="notice">A quieter kind of social. Your feed, your people, no ads.</div><div id="feed">${demoPosts.map(postCard).join('')}</div></section>${peopleCard()}</div>`);loadFeed()}
async function loadFeed(){if(!sb)return;const {data,error}=await sb.from('posts').select('id,caption,image_url,created_at,user_id,profiles(username,display_name,avatar_url)').order('created_at',{ascending:false}).limit(30);if(error){console.warn(error);return}if(data?.length){document.querySelector('#feed').innerHTML=data.map(p=>postCard({id:p.id,name:p.profiles?.display_name||p.profiles?.username||'Member',handle:p.profiles?.username||'member',avatar:(p.profiles?.username||'R')[0].toUpperCase(),caption:p.caption,image_url:p.image_url,time:new Date(p.created_at).toLocaleDateString(),likes:0})).join('')}}
function explore(){shell(`<div class="sectionhead"><div><h1>Explore</h1><span class="muted">Find something worth your attention.</span></div></div><input class="search" id="search" placeholder="Search people, tags, and posts…" value="${esc(searchTerm)}"><div style="height:18px"></div><div id="explore-results" class="grid3">${Array.from({length:18},(_,i)=>`<a class="tile" href="#post=${i+1}" onclick="toast('Open a post from the feed to see details')">${['✳','R','☼','✦','⌁','◌'][i%6]}</a>`).join('')}</div>`);document.querySelector('#search').addEventListener('input',async e=>{searchTerm=e.target.value;if(sb&&searchTerm){const {data}=await sb.from('posts').select('id,caption,image_url').ilike('caption','%'+searchTerm+'%').limit(18);document.querySelector('#explore-results').innerHTML=(data||[]).map((p,i)=>`<a class="tile" href="#post=${p.id}">${p.image_url?`<img src="${esc(p.image_url)}" style="width:100%;height:100%;object-fit:cover">`:['✳','R','☼','✦','⌁','◌'][i%6]}</a>`).join('')}else if(!searchTerm)explore()})}
function create(){shell(`<div style="max-width:700px;margin:auto"><div class="sectionhead"><div><h1>Create</h1><span class="muted">A thought, a photo, a little Markdown.</span></div></div><form class="card pad" id="postform"><div class="field"><label for="caption">Caption (Markdown supported)</label><textarea id="caption" placeholder="What’s on your mind? Try **bold**, *italic*, # heading, or [a link](https://example.com)"></textarea></div><div class="field"><label for="imagefile">Upload an image</label><input id="imagefile" type="file" accept="image/*"><span class="tiny muted">JPG, PNG, GIF, or WebP. Configure the public Supabase Storage bucket named <code>post-images</code>.</span><img id="imagepreview" class="hidden" alt="Selected upload preview" style="width:100%;max-height:360px;object-fit:contain;border-radius:12px"></div><div class="field"><label for="image">Or use an image URL</label><input id="image" type="url" placeholder="https://…"></div><label class="tiny muted">Preview</label><div class="markdown" id="preview">Your caption preview appears here.</div><p class="tiny muted">For direct uploads, configure a Supabase Storage bucket and access policies.</p><button class="btn" type="submit">Publish post</button></form></div>`);document.querySelector('#caption').addEventListener('input',e=>document.querySelector('#preview').innerHTML=md(e.target.value)||'Your caption preview appears here.');document.querySelector('#postform').addEventListener('submit',publish);document.querySelector('#imagefile').addEventListener('change',e=>{const f=e.target.files[0],p=document.querySelector('#imagepreview');if(f){p.src=URL.createObjectURL(f);p.classList.remove('hidden')}else p.classList.add('hidden')})}
async function publish(e){e.preventDefault();if(!sb){toast('Configure Supabase URL and anon key first');return}const u=await getUser();if(!u){go('signin');return}const file=document.querySelector('#imagefile')?.files?.[0];let imageUrl=document.querySelector('#image').value.trim()||null;if(file){if(file.size>8*1024*1024){toast('Images must be under 8 MB');return}const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=`${u.id}/${Date.now()}-${safe}`;const {error:upErr}=await sb.storage.from('post-images').upload(path,file,{upsert:false,contentType:file.type});if(upErr){toast('Image upload failed: '+upErr.message+' Check the post-images bucket and policies.');return}imageUrl=sb.storage.from('post-images').getPublicUrl(path).data.publicUrl}const {error}=await sb.from('posts').insert({user_id:u.id,caption:document.querySelector('#caption').value,image_url:imageUrl});if(error)toast(error.message);else{toast('Post published');go('home')}}
function profile(){shell(`<div style="max-width:850px;margin:auto"><section class="profilehead"><div class="bigavatar" id="profile-avatar">R</div><div style="flex:1"><div class="sectionhead"><div><h1 id="profile-name">Your profile</h1><span class="muted" id="profile-handle">@you</span></div><button class="btn soft" onclick="go('settings')">Edit profile</button></div><div class="stats"><div><strong id="post-count">0</strong><span class="muted">posts</span></div><div><strong id="followers">0</strong><span class="muted">followers</span></div><div><strong id="following">0</strong><span class="muted">following</span></div></div><p id="profile-bio">Your bio goes here. Make it yours.</p></div></section><div class="sectionhead"><strong>POSTS</strong><span class="muted tiny">Your public gallery</span></div><div class="grid3" id="profile-grid">${Array.from({length:9},(_,i)=>`<a class="tile" href="#" onclick="go('home');return false">${i<3?'✦':'＋'}</a>`).join('')}</div><div class="notice">Connect Supabase to load your real profile and posts.</div></div>`);fillProfile()}
async function fillProfile(){const u=await getUser();if(!u)return;const name=u.user_metadata?.display_name||u.email?.split('@')[0]||'Member';document.querySelector('#profile-name').textContent=name;document.querySelector('#profile-handle').textContent='@'+(u.user_metadata?.username||u.email?.split('@')[0]||'member');document.querySelector('#profile-avatar').textContent=name[0].toUpperCase();document.querySelector('#profile-bio').textContent=u.user_metadata?.bio||'Welcome to my RIVET profile.'}
function activity(){shell(`<div style="max-width:700px;margin:auto"><div class="sectionhead"><div><h1>Activity</h1><span class="muted">The good stuff, in one place.</span></div></div><div class="card pad">${[['M','Maya Chen','liked your post','2m'],['J','Jules Rivera','started following you','1h'],['A','Alex Morgan','mentioned you in a comment','4h']].map(x=>`<div class="userrow" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="avatar">${x[0]}</div><div class="meta"><strong>${x[1]}</strong><span class="muted">${x[2]}</span></div><span class="muted tiny">${x[3]}</span></div>`).join('')}<div class="notice">Sample activity. Live notifications need database triggers and Supabase Realtime.</div></div></div>`)}
function settings(){shell(`<div style="max-width:700px;margin:auto"><div class="sectionhead"><div><h1>Settings</h1><span class="muted">Your account, your choices.</span></div></div><form class="card pad" id="settingsform"><h2>Profile</h2><div class="field"><label for="display">Display name</label><input id="display" placeholder="Your name"></div><div class="field"><label for="username">Username</label><input id="username" placeholder="yourhandle"></div><div class="field"><label for="bio">Bio</label><textarea id="bio" placeholder="A little about you…"></textarea></div><button class="btn" type="submit">Save profile</button><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h2>Appearance</h2><p class="muted">Make RIVET look like yours. These choices are saved on this device.</p><div class="field"><label for="theme-mode">Color mode</label><select id="theme-mode" class="search" onchange="localStorage.setItem('rivet-theme',this.value);applyTheme()"><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="field"><label for="accent-color">Accent color</label><input id="accent-color" type="color" value="#6c4cf1" style="width:100%;height:48px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--field)" oninput="localStorage.setItem('rivet-accent',this.value);applyTheme()"></div><div class="field"><label for="bg-color">Page background</label><input id="bg-color" type="color" value="#fafafa" style="width:100%;height:42px;padding:4px" oninput="localStorage.setItem('rivet-bg',this.value);applyTheme()"></div><div class="field"><label for="panel-color">Cards and panels</label><input id="panel-color" type="color" value="#ffffff" style="width:100%;height:42px;padding:4px" oninput="localStorage.setItem('rivet-panel',this.value);applyTheme()"></div><div class="field"><label for="ink-color">Text color</label><input id="ink-color" type="color" value="#19181f" style="width:100%;height:42px;padding:4px" oninput="localStorage.setItem('rivet-ink',this.value);applyTheme()"></div><div class="field"><label for="radius-size">Corner roundness</label><input id="radius-size" type="range" min="4" max="30" value="18" oninput="localStorage.setItem('rivet-radius',this.value);applyTheme()"></div><button class="btn soft" type="button" onclick="['rivet-theme','rivet-accent','rivet-bg','rivet-panel','rivet-ink','rivet-radius'].forEach(k=>localStorage.removeItem(k));applyTheme();settings()">Reset appearance</button><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h2>Security</h2><p class="muted">Supabase Auth handles password updates and recovery. Configure email verification and SMTP for production.</p><div class="field"><label for="newpassword">New password</label><input id="newpassword" type="password" minlength="8" placeholder="At least 8 characters"></div><button class="btn soft" id="changepw" type="button">Update password</button><hr style="border:0;border-top:1px solid var(--line);margin:26px 0"><h2>Privacy</h2><p class="muted">No ads or third-party tracking pixels. Review database policies before launch.</p><button class="btn outline" type="button" onclick="signOut()">Sign out</button></form></div>`);fillSettings();document.querySelector('#settingsform').addEventListener('submit',saveSettings);document.querySelector('#changepw').addEventListener('click',changePassword)}
async function fillSettings(){const u=await getUser();if(!u)return;document.querySelector('#display').value=u.user_metadata?.display_name||'';document.querySelector('#username').value=u.user_metadata?.username||'';document.querySelector('#bio').value=u.user_metadata?.bio||'';document.querySelector('#theme-mode').value=localStorage.getItem('rivet-theme')||'light';document.querySelector('#accent-color').value=localStorage.getItem('rivet-accent')||'#6c4cf1';document.querySelector('#bg-color').value=localStorage.getItem('rivet-bg')||(document.body.classList.contains('dark')?'#111116':'#fafafa');document.querySelector('#panel-color').value=localStorage.getItem('rivet-panel')||(document.body.classList.contains('dark')?'#1b1a22':'#ffffff');document.querySelector('#ink-color').value=localStorage.getItem('rivet-ink')||(document.body.classList.contains('dark')?'#f4f2fa':'#19181f');document.querySelector('#radius-size').value=localStorage.getItem('rivet-radius')||'18'}
async function saveSettings(e){e.preventDefault();if(!sb){toast('Connect Supabase first');return}const {error}=await sb.auth.updateUser({data:{display_name:document.querySelector('#display').value,username:document.querySelector('#username').value,bio:document.querySelector('#bio').value}});toast(error?error.message:'Profile updated')}
async function changePassword(){if(!sb){toast('Connect Supabase first');return}const password=document.querySelector('#newpassword').value;if(password.length<8){toast('Use at least 8 characters');return}const {error}=await sb.auth.updateUser({password});toast(error?error.message:'Password updated. Verification requirements depend on your Supabase Auth settings.')}
function signin(){shell(`<div style="max-width:440px;margin:35px auto"><div style="text-align:center;margin-bottom:20px"><div class="brand" style="justify-content:center"><span class="logo">R</span>RIVET</div><p class="muted">A quieter kind of social.</p></div><div class="card pad"><h1 style="margin:0">Welcome back.</h1><p class="muted">Sign in to your corner of the internet.</p><button class="btn outline full" onclick="oauth('google')">Continue with Google</button><button class="btn outline full" style="margin-top:9px" onclick="oauth('github')">Continue with GitHub</button><div style="text-align:center;color:#999;margin:18px">OR WITH EMAIL</div><form id="loginform"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="current-password"></div><button class="btn full">Sign in</button></form><p class="tiny muted"><a href="#" onclick="go('signup');return false">Create an account</a> · <a href="#" onclick="go('reset');return false">Forgot password?</a></p></div></div>`);document.querySelector('#loginform').addEventListener('submit',async e=>{e.preventDefault();if(!sb){toast('Configure Supabase URL and anon key');return}const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error)toast(error.message);else go('home')})}
function signup(){shell(`<div style="max-width:440px;margin:35px auto"><div class="brand" style="justify-content:center"><span class="logo">R</span>RIVET</div><div class="card pad" style="margin-top:20px"><h1>Create your account</h1><p class="muted">Join a quieter corner of the internet.</p><button class="btn outline full" onclick="oauth('google')">Continue with Google</button><button class="btn outline full" style="margin-top:9px" onclick="oauth('github')">Continue with GitHub</button><form id="signupform"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="btn full">Sign up</button></form><p class="tiny muted">Email confirmation is controlled by Supabase Auth settings.</p></div></div>`);document.querySelector('#signupform').addEventListener('submit',async e=>{e.preventDefault();if(!sb){toast('Configure Supabase URL and anon key');return}const {error}=await sb.auth.signUp({email:document.querySelector('#email').value,password:document.querySelector('#password').value,options:{emailRedirectTo:location.origin+'/'}});toast(error?error.message:'Check your email for the verification link or code.')})}
function reset(){shell(`<div style="max-width:440px;margin:35px auto"><div class="card pad"><h1>Reset password</h1><p class="muted">We’ll send a recovery link to your account email.</p><form id="resetform"><div class="field"><label>Email</label><input id="email" type="email" required></div><button class="btn full">Send recovery email</button></form></div></div>`);document.querySelector('#resetform').addEventListener('submit',async e=>{e.preventDefault();if(!sb){toast('Configure Supabase first');return}const {error}=await sb.auth.resetPasswordForEmail(document.querySelector('#email').value,{redirectTo:location.origin+'/#settings'});toast(error?error.message:'Recovery email sent.')})}
async function oauth(provider){if(!sb){toast('Configure Supabase URL and anon key');return}const {error}=await sb.auth.signInWithOAuth({provider,options:{redirectTo:location.origin+'/'}});if(error)toast(error.message)}
async function follow(handle,btn){if(!sb){btn.textContent=btn.textContent==='Follow'?'Following':'Follow';toast('Demo follow — connect Supabase to save it');return}const u=await getUser();if(!u){go('signin');return}const {data:profile}=await sb.from('profiles').select('id').eq('username',handle).single();if(!profile){toast('Profile not found');return}if(btn.textContent==='Follow'){const {error}=await sb.from('follows').insert({follower_id:u.id,following_id:profile.id});if(error)toast(error.message);else btn.textContent='Following'}else{const {error}=await sb.from('follows').delete().eq('follower_id',u.id).eq('following_id',profile.id);if(error)toast(error.message);else btn.textContent='Follow'}}
async function go(r){const publicRoutes=['signin','signup','reset'];if(!publicRoutes.includes(r)){if(!sb){route='signin';history.replaceState(null,'','#signin');signin();toast('Create an account after configuring Supabase in this file.');return}const u=await getUser();if(!u){route='signin';history.replaceState(null,'','#signin');signin();return}}route=r;history.replaceState(null,'',r==='home'?location.pathname:'#'+r);({home,explore,create,profile,activity,settings,signin,signup,reset}[r]||home)();window.scrollTo(0,0)}
function routeFromHash(){const h=location.hash.slice(1);if(h.startsWith('post=')){route='individual';const id=decodeURIComponent(h.slice(5));shell(`<div style="max-width:650px;margin:auto"><div class="sectionhead"><h1>Post</h1><button class="btn outline" onclick="go('home')">← Feed</button></div>${postCard(demoPosts.find(p=>p.id===id)||demoPosts[0])}</div>`);return}const r=h.split('&')[0];if(['home','explore','create','profile','activity','settings','signin','signup','reset'].includes(r))go(r);else home()}
window.addEventListener('hashchange',routeFromHash);
(async()=>{if(!sb){location.replace(AUTH_URL);return}const {data:{session}}=await sb.auth.getSession();if(!session){location.replace(AUTH_URL);return}const target=correctPlatformUrl();if(location.origin!==new URL(target).origin){location.replace(target);return}if(['#signin','#signup','#reset'].includes(location.hash)){location.replace(target);return}routeFromHash();sb.auth.onAuthStateChange((_event,nextSession)=>{if(!nextSession)location.replace(AUTH_URL)})})();
</script>
</body></html>
